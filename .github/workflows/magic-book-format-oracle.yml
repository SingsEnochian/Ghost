name: Magic Book Format Oracle

on:
  push:
    branches:
      - 'magic-book/phase-2-noisy-attunement'
    paths:
      - '.github/workflows/magic-book-format-oracle.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Format Phase 2 files and print exact contents
        shell: bash
        run: |
          pnpm exec oxfmt \
            .github/workflows/magic-book-smoke.yml \
            apps/magic-book/src/attunement/bank-transport.js \
            apps/magic-book/src/attunement/engine.js \
            apps/magic-book/src/attunement/noisy.js
          for file in \
            .github/workflows/magic-book-smoke.yml \
            apps/magic-book/src/attunement/bank-transport.js \
            apps/magic-book/src/attunement/engine.js \
            apps/magic-book/src/attunement/noisy.js
          do
            echo "FORMAT_ORACLE_BEGIN:${file}"
            base64 -w0 "${file}"
            echo
            echo "FORMAT_ORACLE_END:${file}"
          done
